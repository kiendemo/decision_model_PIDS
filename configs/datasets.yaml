# The five in-scope hosts: a MIRROR of src/habitus/hosts.py (the code is the source of truth;
# tests/test_config.py asserts this file == the code). Users never edit it: after rebuilding the
# graphs from the dumps, `habitus data manifest` recomputes the clean days and FAILS on any difference.
#
# clean: usable attack-free days (train + val minus attack dates, >= 10% of the median clean-day
#   graph bytes); test: configured test days with a non-empty card file; predeploy: clean days
#   before the first configured test day; inner: last predeploy day; k2: first two clean days;
#   main_k: k of the main-table row; k0_nulls: k = 0 null score files exist (E2 and E1-L3);
#   e1_levels: E1 levels with score files per k; gt_files: ground-truth CSVs in PIDSMaker config
#   order (names only; only habitus.eval reads them); test_day_nodes: nodes with a card on >= 1 test
#   day; n_universe: evaluation universe (adds GT nodes without a test-day card); card_days: every
#   day with a card file; train_dates / val_dates / attack_windows: the PIDSMaker config windows.

datasets: ["CADETS_E3", "THEIA_E3", "CLEARSCOPE_E3", "optc_h501", "ATLASV2_EDR"]
os_family: {CADETS_E3: "freebsd", THEIA_E3: "linux", CLEARSCOPE_E3: "android", optc_h501: "windows", ATLASV2_EDR: "windows"}
dev_hosts: ["CADETS_E3", "THEIA_E3", "ATLASV2_EDR", "optc_h501"]
