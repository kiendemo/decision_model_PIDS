# Laya trainer recipe, layout L-a (habitus.train.laya.RECIPE_L; YAML == code, asserted by
# tests/test_dm_mirror_laya.py). Full fine-tune of ModernBERT-large + the 2 Laya head layers.
trainer: laya
layout: la
init: typed-decisions
seeds: [0, 1, 2]
recipe:
  epochs: 1
  encoder_lr: 2.5e-05
  head_lr: 0.0001
  min_lr: 1.0e-06
  weight_decay: 0.01
  schedule: cosine
  warmup: 0.03
  batch_size: 64
  micro_batch: 16
  max_tokens: 16384
  megabatch: 64
  grad_clip: 1.0
  grad_ckpt: true
  bf16: true
  seed: 0
  loss: soft-ce
  max_len: 2048
  head_max_len: 256
  qtype: choice
